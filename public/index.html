<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artavil Crown</title>
  <meta name="description" content="Artavil Crown">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
    }
    /* عکس کل صفحه را پر می‌کند */
    .hero {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
<body>
  <!--
    دو عکس:
    - public/images/mobile.png  برای موبایل و صفحه‌های عمودی (پیشنهاد: 1080x1920)
    - public/images/desktop.png برای دسکتاپ و صفحه‌های افقی (پیشنهاد: 1920x1080)
  -->
  <picture>
    <source media="(max-aspect-ratio: 1/1)" srcset="/images/mobile.png">
    <img class="hero" src="/images/desktop.png" alt="Artavil Crown">
  </picture>
</body>
</html>
