<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artavil Crown</title>
  <meta name="description" content="Artavil Crown">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
    }
    /* عکس کل صفحه را پر می‌کند */
    .hero {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
<body>
  <!-- برای عوض کردن عکس، فقط مقدار src را عوض کنید -->
  <img class="hero" src="/images/photo.jpg" alt="Artavil Crown">
</body>
</html>
